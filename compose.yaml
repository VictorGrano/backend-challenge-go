services:
  postgres:
    image: postgres:17
    container_name: jungle-postgres
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: jungle_challenge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://jungle:devpassword@postgres:5432/jungle_challenge?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqs-init:
    image: amazon/aws-cli:2.17.56
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./deploy/sqs:/queues:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws sqs create-queue --queue-name wager-transactions-dlq.fifo --attributes file:///queues/fifo.json
        aws sqs create-queue --queue-name wager-transactions.fifo --attributes file:///queues/wager-transactions.json
        aws sqs create-queue --queue-name wager-events.fifo --attributes file:///queues/fifo.json
    depends_on:
      localstack:
        condition: service_healthy

  app:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://jungle:devpassword@postgres:5432/jungle_challenge?sslmode=disable
      OIDC_ISSUER: http://localhost:8081/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      OIDC_AUDIENCE: wagering-api
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
    deploy:
      replicas: 3
    ports:
      - "8090-8092:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
